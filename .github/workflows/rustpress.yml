name: Rustpress CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install repository-pinned Rust
        shell: bash
        run: |
          toolchain="$(python3 -c 'import re, tomllib; t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", t), "exact Rust version required"; print(t)')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc --version

      - name: Validate dependency lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --locked --release

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Surfaces new advisories without failing the build; a human reviews and
    # resolves findings deliberately rather than being blocked by an upstream
    # disclosure. See docs/journal/CHECKPOINT.md for the last reviewed result.
    continue-on-error: true

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install repository-pinned Rust
        shell: bash
        continue-on-error: true
        run: |
          toolchain="$(python3 -c 'import re, tomllib; t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", t), "exact Rust version required"; print(t)')"
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.nvmrc

      - name: npm audit
        working-directory: site
        continue-on-error: true
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low
