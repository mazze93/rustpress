# Python lint for build.py and extractors/. Run via ./lint.sh (pinned ruff).
target-version = "py312"
line-length = 100
extend-exclude = ["target"]

[lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "PTH",           # pathlib over os.path
  "RUF",           # ruff-specific
  "PL",            # pylint
  "S",             # bandit (security)
  "C4",            # comprehensions
  "RET",           # return hygiene
]
ignore = [
  "PLR2004",  # magic values: binary format parsing is all literal offsets
  "PLR0912",  # branches: format decoders are branchy by nature
  "S101",     # assert is fine in tests
]

[lint.per-file-ignores]
# build.py runs cargo/rustup by fixed argv, never shell; inputs are repo files.
"build.py" = ["S603", "S607"]
"extractors/test_*.py" = ["PLR0913", "S108"]
