[package]
name = "rustpress"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deliberate, sealed static publishing"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cssparser = "0.35"
fs2 = "0.4"
libc = "0.2"
lol_html = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
proptest = "1"
